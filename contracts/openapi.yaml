openapi: 3.1.0
info:
  title: MinistrySprout API
  version: 1.0.0
servers:
  - url: /api
components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
        - correlation_id
      properties:
        code:
          type: string
        message:
          type: string
        correlation_id:
          type: string
          format: uuid
        field_errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    PageMeta:
      type: object
      required:
        - next_cursor
        - has_more
      properties:
        next_cursor:
          type:
            - string
            - "null"
        has_more:
          type: boolean
    SyncPushRequest:
      type: object
      required:
        - device_id
        - batch_id
        - events
      properties:
        device_id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        events:
          type: array
          items:
            type: object
            additionalProperties: true
    SyncPushResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            type: object
            additionalProperties: true
    SyncPullResponse:
      type: object
      required:
        - changes
        - page
      properties:
        changes:
          type: array
          items:
            type: object
            additionalProperties: true
        page:
          $ref: "#/components/schemas/PageMeta"
    AccountSession:
      type: object
      additionalProperties: false
      required:
        - email_verified
        - mfa_confirmed
      properties:
        email_verified: &a1
          type: boolean
        mfa_confirmed: *a1
    ChurchAccount:
      type: object
      additionalProperties: false
      required:
        - id
        - display_name
        - email_verified
        - memberships
        - assignments
        - active_session
      properties:
        id:
          type: integer
        display_name: &a3
          type: string
        email_verified: *a1
        memberships:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - church_id
              - role
              - status
            properties:
              church_id: &a2
                type: string
                format: uuid
              role:
                type: string
                enum:
                  - owner
                  - teacher
              status:
                type: string
                const: active
        assignments:
          type: object
          additionalProperties: false
          required:
            - ministry_ids
          properties:
            ministry_ids:
              type: array
              items: *a2
        active_session:
          type: object
          additionalProperties: false
          required:
            - mfa_confirmed
          properties:
            mfa_confirmed: *a1
    PlatformSession:
      type: object
      additionalProperties: false
      required:
        - handle
        - online_only
      properties:
        handle: *a3
        online_only:
          type: boolean
          const: true
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
    PlatformLoginRequest:
      type: object
      additionalProperties: false
      required:
        - handle
        - password
      properties:
        handle:
          type: string
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
    LoginResult:
      type: object
      additionalProperties: false
      required:
        - two_factor
      properties:
        two_factor: *a1
    NewPassword:
      type: object
      additionalProperties: false
      required:
        - password
        - password_confirmation
      properties:
        password: &a4
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
        password_confirmation: *a4
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - token
        - password
        - password_confirmation
      properties:
        email:
          type: string
          format: email
        token:
          type: string
          writeOnly: true
        password: *a4
        password_confirmation: *a4
    PasswordConfirmation:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
    MfaChallenge:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - code
          properties:
            code:
              type: string
              pattern: ^\d{6}$
              writeOnly: true
        - type: object
          additionalProperties: false
          required:
            - recovery_code
          properties:
            recovery_code:
              type: string
              maxLength: 128
              writeOnly: true
    MfaCode:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: ^\d{6}$
          writeOnly: true
    PlatformSetupConfirmation:
      type: object
      additionalProperties: false
      required:
        - code
        - recovery_codes_acknowledged
      properties:
        code:
          type: string
          pattern: ^\d{6}$
          writeOnly: true
        recovery_codes_acknowledged:
          type: boolean
          const: true
    PlatformSetupStatus:
      type: object
      additionalProperties: false
      required:
        - handle
        - status
        - expires_at
      properties:
        handle: *a3
        status:
          type: string
          const: pending
        expires_at:
          type: string
          format: date-time
    PlatformEnrollment:
      type: object
      additionalProperties: false
      required:
        - secret
        - qr_code
        - recovery_codes
      properties:
        secret: *a3
        qr_code:
          type: string
          description: otpauth URI for an authenticator; not HTML or SVG.
        recovery_codes: &a5
          type: array
          items: *a3
    CsrfToken:
      type: object
      additionalProperties: false
      required:
        - csrf_token
      properties:
        csrf_token: *a3
    Message:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message: *a3
    SecretKey:
      type: object
      additionalProperties: false
      required:
        - secretKey
      properties:
        secretKey: *a3
    QrCode:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - svg
            - url
          properties:
            svg: *a3
            url: *a3
        - type: array
          maxItems: 0
    RecoveryCodes: *a5
    PasswordStatus:
      type: object
      additionalProperties: false
      required:
        - confirmed
      properties:
        confirmed: *a1
    UpdateProfile:
      type: object
      additionalProperties: false
      required:
        - name
        - email
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
    UpdatePassword:
      type: object
      additionalProperties: false
      required:
        - current_password
        - password
        - password_confirmation
      properties:
        current_password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
        password: *a4
        password_confirmation: *a4
    ChurchApplication:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - church_name
        - city
        - address
        - timezone
        - church_id
        - category
        - reason
        - submitted_at
        - decided_at
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
        church_name: &a6
          type: &a7
            - string
            - "null"
        city: *a6
        address: *a6
        timezone: *a6
        church_id:
          type: *a7
          format: uuid
        category:
          type: *a7
          enum:
            - duplicate
            - ineligible
            - incomplete
            - other
            - null
        reason: *a6
        submitted_at:
          type: string
          format: date-time
        decided_at:
          type: *a7
          format: date-time
    SubmitChurchApplication:
      type: object
      additionalProperties: false
      required:
        - church_name
        - city
        - timezone
        - captcha_token
      properties:
        church_name:
          type: string
          minLength: 1
          maxLength: 160
        city:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type:
            - string
            - "null"
          maxLength: 240
        timezone:
          type: string
          description: IANA timezone identifier
          maxLength: 100
        captcha_token:
          type: string
          minLength: 1
          maxLength: 2048
          writeOnly: true
    CurrentChurchApplication:
      type: object
      additionalProperties: false
      required:
        - application
      properties:
        application:
          anyOf:
            - $ref: "#/components/schemas/ChurchApplication"
            - type: "null"
    ApplicationReviewPage:
      type: object
      additionalProperties: false
      required:
        - data
        - page
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ChurchApplication"
        page:
          type: integer
          minimum: 1
        has_more:
          type: boolean
    RejectChurchApplication:
      type: object
      additionalProperties: false
      required:
        - category
        - reason
      properties:
        category:
          type: string
          enum:
            - duplicate
            - ineligible
            - incomplete
            - other
        reason:
          type: string
          minLength: 1
          maxLength: 500
    Teacher:
      type: object
      additionalProperties: false
      required:
        - id
        - display_name
        - status
        - ministry_ids
        - can_manage
      properties:
        id: &a8
          type: string
          format: uuid
        display_name:
          type: string
        status:
          type: string
          enum:
            - active
            - revoked
        ministry_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items: *a8
        can_manage:
          type: boolean
    TeacherList:
      type: object
      additionalProperties: false
      required:
        - data
        - has_more
        - can_invite
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Teacher"
        has_more:
          type: boolean
        can_invite:
          type: boolean
    TeacherInvitation:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - role
        - status
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - teacher
        status:
          type: string
          enum:
            - pending
            - accepted
            - expired
            - revoked
        expires_at:
          type: string
          format: date-time
    TeacherInvitationList:
      type: object
      additionalProperties: false
      required:
        - data
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TeacherInvitation"
        has_more:
          type: boolean
    InviteTeacher:
      type: object
      additionalProperties: false
      required:
        - email
        - ministry_ids
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        ministry_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
          minItems: 1
    TeacherAssignments:
      type: object
      additionalProperties: false
      required:
        - ministry_ids
      properties:
        ministry_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
    AcceptTeacherInvitation:
      type: object
      additionalProperties: false
      required:
        - church_id
        - invitation_id
        - token
        - signature
        - expires
        - email
      properties:
        church_id: &a8
          type: string
          format: uuid
        invitation_id: *a8
        token:
          type: string
          minLength: 64
          maxLength: 64
          writeOnly: true
        signature:
          type: string
          minLength: 64
          maxLength: 64
          writeOnly: true
        expires:
          type: integer
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          maxLength: 120
        password:
          type: string
          minLength: 12
          maxLength: 128
          format: password
          writeOnly: true
    InvitationAccepted:
      type: object
      additionalProperties: false
      required:
        - church_id
        - status
      properties:
        church_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - accepted
    TransferOwnership:
      type: object
      additionalProperties: false
      required:
        - target_membership_id
        - password
        - code
      properties:
        target_membership_id:
          type: string
          format: uuid
        password:
          type: string
          format: password
          maxLength: 128
          writeOnly: true
        code:
          type: string
          pattern: ^\d{6}$
          writeOnly: true
    AssignedMinistry:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    AssignedMinistries:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AssignedMinistry"
    Ministry:
      type: object
      additionalProperties: false
      required: [id, name, status, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        status: { type: string, enum: [active, archived] }
        version: { type: integer, minimum: 1 }
    MinistryList:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Ministry" } }
    StudentInput:
      type: object
      additionalProperties: false
      required: [first_name, last_name]
      properties:
        first_name: { type: string, maxLength: 120 }
        middle_name: { type: [string, "null"], maxLength: 120 }
        last_name: { type: string, maxLength: 120 }
        preferred_name: { type: [string, "null"], maxLength: 120 }
        suffix: { type: [string, "null"], maxLength: 40 }
        date_of_birth: { type: [string, "null"], format: date }
        gender: { type: [string, "null"], maxLength: 32, description: Accepted values include male/m/boy, female/f/girl, and blank/unknown/unspecified. }
        external_reference: { type: [string, "null"], maxLength: 120 }
        ministry_ids: { type: array, maxItems: 100, items: { type: string, format: uuid } }
    Student:
      type: object
      additionalProperties: true
      required: [id, first_name, last_name, display_name, gender, status, version, ministry_ids]
      properties:
        id: { type: string, format: uuid }
        first_name: { type: string }
        middle_name: { type: [string, "null"] }
        last_name: { type: string }
        preferred_name: { type: [string, "null"] }
        suffix: { type: [string, "null"] }
        display_name: { type: string }
        gender: { type: string, enum: [male, female, unspecified] }
        status: { type: string, enum: [active, archived] }
        version: { type: integer, minimum: 1 }
        ministry_ids: { type: array, items: { type: string, format: uuid } }
        date_of_birth: { type: [string, "null"], format: date }
        birth_month_day: { type: [string, "null"], pattern: '^\\d{2}-\\d{2}$' }
        age: { type: [integer, "null"], minimum: 0 }
        external_reference: { type: [string, "null"] }
    StudentList:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Student" } }
    ImportStudentData:
      type: object
      additionalProperties: false
      properties:
        first_name: { type: string }
        middle_name: { type: [string, "null"] }
        last_name: { type: string }
        preferred_name: { type: [string, "null"] }
        suffix: { type: [string, "null"] }
        date_of_birth: { type: [string, "null"], format: date }
        gender: { type: string, enum: [male, female, unspecified] }
        external_reference: { type: [string, "null"] }
    ImportRow:
      type: object
      additionalProperties: false
      required: [id, row_number, status, source, data, ministry_names, ministry_ids, unknown_ministries, errors, outcome]
      properties:
        id: { type: string, format: uuid }
        row_number: { type: integer, minimum: 2, maximum: 501 }
        status: { type: string, enum: [valid, invalid, duplicate, needs_mapping] }
        source:
          type: object
          additionalProperties: false
          properties:
            first_name: { type: [string, "null"] }
            last_name: { type: [string, "null"] }
            middle_name: { type: [string, "null"] }
            preferred_name: { type: [string, "null"] }
            suffix: { type: [string, "null"] }
            birthdate: { type: [string, "null"] }
            gender: { type: [string, "null"] }
            ministries: { type: [string, "null"] }
            external_reference: { type: [string, "null"] }
        data: { $ref: "#/components/schemas/ImportStudentData" }
        ministry_names: { type: array, items: { type: string } }
        ministry_ids: { type: array, items: { type: string, format: uuid } }
        unknown_ministries: { type: array, items: { type: string } }
        errors: { type: array, items: { type: string } }
        outcome: { type: [string, "null"], enum: [committed, excluded, duplicate, null] }
    ImportCounts:
      type: object
      additionalProperties: false
      required: [valid, invalid, duplicate, needs_mapping]
      properties:
        valid: { type: integer, minimum: 0, maximum: 500 }
        invalid: { type: integer, minimum: 0, maximum: 500 }
        duplicate: { type: integer, minimum: 0, maximum: 500 }
        needs_mapping: { type: integer, minimum: 0, maximum: 500 }
    ImportPreview:
      type: object
      additionalProperties: false
      required: [id, state, expires_at, counts, rows]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [uploaded, previewed, committing, completed, failed, expired] }
        expires_at: { type: string, format: date-time }
        counts: { $ref: "#/components/schemas/ImportCounts" }
        rows: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/ImportRow" } }
    ImportCommitResult:
      type: object
      additionalProperties: false
      required: [id, state, counts]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [completed, expired] }
        counts:
          type: object
          additionalProperties: false
          required: [committed, excluded]
          properties:
            committed: { type: integer, minimum: 0, maximum: 500 }
            excluded: { type: integer, minimum: 0, maximum: 500 }
            duplicate: { type: integer, minimum: 0, maximum: 500 }
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - category
        - action
        - result
        - actor_type
        - actor_id
        - target_type
        - target_id
        - correlation_id
        - occurred_at
      properties:
        id: &a9
          type: string
          format: uuid
        category:
          type: string
          enum:
            - church
            - platform
        action:
          type: string
          maxLength: 64
        result:
          type: string
          enum:
            - success
            - failure
            - denied
        actor_type:
          type: string
          enum:
            - user
            - platform_admin
            - system
            - anonymous
        actor_id:
          type:
            - string
            - "null"
          maxLength: 36
        target_type:
          type: string
          maxLength: 32
        target_id:
          type:
            - string
            - "null"
          maxLength: 36
        correlation_id: *a9
        occurred_at:
          type: string
          format: date-time
    AuditPage:
      type: object
      additionalProperties: false
      required:
        - data
        - page
        - per_page
        - has_more
        - scope
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AuditEvent"
        page:
          type: integer
          minimum: 1
          maximum: 10000
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        has_more:
          type: boolean
        scope:
          type: string
          enum:
            - church
            - own
            - platform
  securitySchemes:
    ChurchSession:
      type: apiKey
      in: cookie
      name: ministrysprout_session
      description: Sanctum same-origin SPA session; cookie name configurable via SESSION_COOKIE. No bearer tokens.
    PlatformSession:
      type: apiKey
      in: cookie
      name: ministrysprout_platform_session
      description: Distinct platform session scoped to /platform; mandatory confirmed MFA.
  responses:
    AuthError:
      description: Safe error envelope. 401 unauthenticated; 403 access or recent-password confirmation required; 410 expired setup; 419 CSRF mismatch; 422 invalid input; 429 rate limit. Responses are no-store.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NoContent:
      description: Completed; no response body.
    FortifySuccess:
      description: Fortify operation completed.
      content:
        application/json:
          schema:
            type: string
            const: ""
paths:
  /ministries:
    get:
      operationId: listMinistries
      description: Active verified member required. Teachers see only actively assigned ministries. Owners may request include_archived=true.
      parameters:
        - { name: X-Church-Id, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: include_archived, in: query, required: false, schema: { type: boolean } }
      responses:
        "200": { description: Ministry list, headers: { X-Correlation-Id: { description: Request correlation UUID. Invalid or missing client values are replaced., schema: { type: string, format: uuid } } }, content: { application/json: { schema: { $ref: "#/components/schemas/MinistryList" } } } }
    post:
      operationId: createMinistry
      description: Owner only; audited. Online cookie session and CSRF required.
      parameters: [{ name: X-Church-Id, in: header, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [name], properties: { name: { type: string, maxLength: 120 } } } } }
      responses:
        "201": { description: Created, headers: { X-Correlation-Id: { description: Request correlation UUID. Invalid or missing client values are replaced., schema: { type: string, format: uuid } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Ministry" } } } }
  /ministries/{id}:
    put:
      operationId: updateMinistry
      description: Owner only; audited. Ministry ID must belong to the active church.
      parameters:
        - { name: X-Church-Id, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [name], properties: { name: { type: string, maxLength: 120 } } } } }
      responses:
        "200": { description: Updated ministry, headers: { X-Correlation-Id: { description: Request correlation UUID. Invalid or missing client values are replaced., schema: { type: string, format: uuid } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Ministry" } } } }
  /ministries/{id}/{status}:
    post:
      operationId: changeMinistryStatus
      description: Owner only; archive or restore ministry and audit the change.
      parameters:
        - { name: X-Church-Id, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: path, required: true, schema: { type: string, enum: [archive, restore] } }
      responses:
        "200": { description: Updated ministry, headers: { X-Correlation-Id: { description: Request correlation UUID. Invalid or missing client values are replaced., schema: { type: string, format: uuid } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Ministry" } } } }
  /students:
    get:
      operationId: listStudents

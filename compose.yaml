services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ministrysprout
      POSTGRES_USER: ministrysprout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ministrysprout -d ministrysprout']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27.7
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8025/api/v1/info >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

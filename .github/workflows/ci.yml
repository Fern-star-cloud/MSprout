name: CI

on:
  pull_request:
  push:
    branches: [main, feat/mvp-foundation]

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:test
      - run: pnpm web:typecheck
      - run: pnpm web:build

  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ministrysprout
          POSTGRES_USER: ministrysprout
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ministrysprout -d ministrysprout"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ministrysprout
      DB_USERNAME: ministrysprout
      DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: apps/api
      - run: php apps/api/artisan migrate --force
      - run: php apps/api/artisan test
